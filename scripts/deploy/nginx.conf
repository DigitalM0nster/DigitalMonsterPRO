# HTTP bootstrap configuration. HTTPS is enabled after public DNS points here.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name digital-monster.pro www.digital-monster.pro;
    root /var/www/digital-monster/current;
    index index.html;
    server_tokens off;
    access_log /var/log/nginx/digital-monster.access.log;
    error_log /var/log/nginx/digital-monster.error.log;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;
    add_header X-Content-Type-Options nosniff always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }
    location ~ /\. { deny all; }
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        try_files $uri =503;
    }
    location = /__release.json {
        add_header Cache-Control "no-store" always;
        try_files $uri =503;
    }
    location ^~ /assets/ {
        root /var/www/digital-monster/shared;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location ~* \.(?:js|css|json|glb|gltf|bin|hdr|ktx2|wasm|mp4|webm|mp3|ogg|wav|woff2?|ttf|otf|png|jpe?g|webp|avif|svg|ico|cur)$ {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }
    location / { try_files $uri $uri/ /index.html; }
}
